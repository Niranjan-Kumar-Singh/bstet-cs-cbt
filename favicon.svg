<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Symbol Gradient (Cyan to Indigo) -->
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Accent Gold Gradient (Tassel & Star) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Crisp Double Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Background Decorative Grid Hint -->
  <path d="M20 64h88M64 20v88" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Academic Mortarboard (Education / STET Teacher Milestone) -->
  <g filter="url(#softGlow)">
    <!-- Mortarboard Rhombus Top -->
    <polygon points="64,22 104,38 64,54 24,38" fill="url(#symbolGrad)" stroke="#60a5fa" stroke-width="1.5" />
    
    <!-- Cap Under-Brim -->
    <path d="M40 45v13c0 8 11 14 24 14s24-6 24-14V45" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
    
    <!-- Gold Tassel -->
    <circle cx="64" cy="38" r="2.5" fill="url(#goldGrad)" />
    <path d="M64 38c12 2 18 10 20 18" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="84" cy="56" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Digital Code / Terminal Symbol (Computer Science Core) -->
  <!-- Left Angle Bracket < -->
  <path d="M42 78L32 87L42 96" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Slash / -->
  <line x1="56" y1="99" x2="68" y2="75" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Right Angle Bracket > -->
  <path d="M86 78L96 87L86 96" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Live Exam Activity Pulse Dot (Top Right) -->
  <circle cx="102" cy="24" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2" />
</svg>
