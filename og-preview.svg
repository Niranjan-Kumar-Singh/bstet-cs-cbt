<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Grid Accent -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Mission Badge Pill -->
  <g transform="translate(80, 70)">
    <rect width="360" height="42" rx="21" fill="url(#pillGrad)" />
    <text x="180" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">🔥 MISSION BSTET 2026</text>
  </g>

  <!-- Category & Subject Tag -->
  <text x="80" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#93c5fd" letter-spacing="0.5">BIHAR SECONDARY TEACHER ELIGIBILITY TEST (PAPER II)</text>

  <!-- Main Title -->
  <text x="80" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">Computer Science CBT Portal</text>

  <!-- Subtitle -->
  <text x="80" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" fill="#cbd5e1">Class 11-12 (Subject Code: 226) • Complete 150-Question CBT Simulation</text>

  <!-- Feature Grid Cards -->
  <g transform="translate(80, 360)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="235" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#60a5fa">23 Papers</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">3,000+ Questions</text>

    <!-- Card 2 -->
    <rect x="255" y="0" width="235" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="280" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#34d399">Bilingual</text>
    <text x="280" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">English &amp; हिन्दी (Hindi)</text>

    <!-- Card 3 -->
    <rect x="510" y="0" width="235" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="535" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#fbbf24">Official PYQs</text>
    <text x="535" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">2025 Verified Keys</text>

    <!-- Card 4 -->
    <rect x="765" y="0" width="275" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="790" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f472b6">TCS iON Mode</text>
    <text x="790" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">Timer + Palette + Matrix</text>
  </g>

  <!-- Footer Branding Bar -->
  <line x1="80" y1="525" x2="1120" y2="525" stroke="#334155" stroke-width="1" />
  
  <text x="80" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">
    ⚡ Crafted with Excellence by <tspan fill="#60a5fa">Niranjan Kumar Singh</tspan>
  </text>

  <text x="1120" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="end">
    bstet-cs-cbt.vercel.app
  </text>
</svg>
